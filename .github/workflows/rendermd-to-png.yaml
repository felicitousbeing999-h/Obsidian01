name: render-md-mermaid

on:
  push:
    paths:
      - '**.md'

permissions:
  contents: write

jobs:
  render-md-mermaid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid diagrams in Markdown files
        run: |
          # Finds all markdown files and converts code blocks with mmdc
          find . -name "*.md" -not -path "./.git/*" -not -path "./node_modules/*" -print0 | while IFS= read -r -d '' file; do
            echo "Processing $file..."
            npx @mermaid-js/mermaid-cli -i "$file" -o "$file" || true
          done

      - name: Commit rendered files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "*.png *.svg *.md"
          commit_message: "chore: automatically render mermaid diagrams [skip ci]"
